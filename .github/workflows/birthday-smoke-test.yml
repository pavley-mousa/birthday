name: Birthday project smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile both Python files
        run: python -m py_compile birthday_upgrade.py birthday_upgrade_original.py
      - name: Run headless smoke tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import cv2
          import birthday_upgrade as launcher

          # Verify the launcher points to the original full animation.
          assert launcher.ORIGINAL_FILE.is_file(), "Original animation file missing"
          assert launcher.PARTY_NAME == "Pavley Mousa"
          assert launcher.PARTY_TAG == "@eng.bevo"
          assert launcher.FULLSCREEN is True
          assert launcher.SLIDE_FILES == [f"{i}.jpg" for i in range(1, 16)]

          # Exercise full-photo fitting without needing a display or camera.
          portrait = np.zeros((160, 90, 3), dtype=np.uint8)
          fitted = launcher.birthday.fit_photo(portrait, 320, 180)
          assert fitted.shape == (180, 320, 3), f"Unexpected fitted size: {fitted.shape}"

          # Reproduce the OpenCV API-missing case that previously crashed.
          cv2_module = launcher.birthday.cv2
          had_api = hasattr(cv2_module, "CascadeClassifier")
          saved_api = getattr(cv2_module, "CascadeClassifier", None)
          try:
              if had_api:
                  delattr(cv2_module, "CascadeClassifier")
              assert launcher.safe_load_cascade(quiet=True) is None
          finally:
              if had_api:
                  setattr(cv2_module, "CascadeClassifier", saved_api)

          # Report missing numbered images; the app should skip missing files
          # instead of crashing, but all 15 are expected for the full reel.
          missing = [f"{i}.jpg" for i in range(1, 16)
                     if not Path(f"{i}.jpg").is_file()]
          if missing:
              print("WARNING: missing slideshow photos:", ", ".join(missing))
          else:
              print("All 15 slideshow photos are present.")

          print("PASS: import, settings, full-photo fit, and OpenCV fallback.")
          PY
